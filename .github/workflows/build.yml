name: Build

on:
  schedule:
    # Nightly at 00:57 UTC, offset from AccessiWeather (00:17),
    # PortkeyDrop (00:27), and Freight Fate (00:47). GitHub Actions
    # schedules are UTC-only and can queue late, so avoid :00/:30.
    - cron: "57 0 * * *"
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Skip release creation'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      version: ${{ steps.check.outputs.version }}
      is_nightly: ${{ steps.check.outputs.is_nightly }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Release gate: nightlies snapshot the dev branch; stable releases
          # build the pushed tag; manual dispatches build the chosen ref.
          ref: ${{ github.event_name == 'schedule' && 'dev' || github.ref }}
          fetch-depth: 0

      - name: Check build conditions
        id: check
        run: |
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # Tagged stable release
            echo "is_nightly=false" >> $GITHUB_OUTPUT
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            # Manual snapshot dispatches are intentional force-builds.
            echo "is_nightly=true" >> $GITHUB_OUTPUT
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "tag=nightly-$(date -u +%Y%m%d)" >> $GITHUB_OUTPUT
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          else
            # Scheduled developer snapshot from dev - only when something
            # user-facing changed since the previous snapshot.
            echo "is_nightly=true" >> $GITHUB_OUTPUT
            echo "tag=nightly-$(date -u +%Y%m%d)" >> $GITHUB_OUTPUT
            echo "version=$VERSION" >> $GITHUB_OUTPUT

            LAST_TAG=$(git tag --list "nightly-*" --sort=-version:refname | head -1)

            if [ -z "$LAST_TAG" ]; then
              echo "should_build=true" >> $GITHUB_OUTPUT
            else
              USER_FACING_PATHS=$(git diff --name-only "$LAST_TAG"..HEAD -- \
                src/ \
                data/ \
                installer/ \
                pyproject.toml \
                tools/build_release.py | sed '/^$/d')

              if [ -n "$USER_FACING_PATHS" ]; then
                echo "should_build=true" >> $GITHUB_OUTPUT
              else
                echo "should_build=false" >> $GITHUB_OUTPUT
              fi
            fi
          fi

  build:
    name: ${{ matrix.label }}
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
          - os: macos-latest
            label: macOS
          - os: ubuntu-latest
            label: Linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'schedule' && 'dev' || github.ref }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --group dev --group build

      - name: Run tests
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          SALTWAKE_NO_SPEECH: "1"
        run: uv run pytest -q

      - name: Headless self-test
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          SALTWAKE_NO_SPEECH: "1"
        run: uv run python src/main.py --self-test

      - name: Check release dependencies
        run: uv run python tools/build_release.py --check-dependencies

      - name: Build
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          SALTWAKE_NO_SPEECH: "1"
        run: >
          uv run python tools/build_release.py
          --tag "${{ needs.prepare.outputs.is_nightly == 'true' && needs.prepare.outputs.tag || needs.prepare.outputs.version }}"

      - name: Package AppImage
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 15
        run: >
          uv run python installer/build_appimage.py
          --tag "${{ needs.prepare.outputs.is_nightly == 'true' && needs.prepare.outputs.tag || needs.prepare.outputs.version }}"

      - name: Smoke test AppImage on Fedora
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 15
        run: |
          cat > fedora-smoke.sh <<'EOF'
          set -e
          dnf install -y -q alsa-lib xorg-x11-server-Xvfb dejavu-sans-fonts >/dev/null
          cd /work
          appimage=$(find dist -maxdepth 1 -name 'Saltwake-*-linux-x86_64.AppImage' -print -quit)
          if [ -z "$appimage" ]; then
            echo "AppImage was not created."
            exit 1
          fi
          chmod +x "$appimage"
          # No SALTWAKE_DATA_DIR: let AppRun pick the writable home itself,
          # the same path players exercise.
          export SALTWAKE_NO_SPEECH=1
          export HOME=/tmp
          set +e
          timeout 60s "$appimage" --appimage-extract-and-run --self-test > fedora-smoke.log 2>&1
          selftest_status=$?
          timeout 25s xvfb-run -a "$appimage" --appimage-extract-and-run >> fedora-smoke.log 2>&1
          launch_status=$?
          set -e
          cat fedora-smoke.log
          if grep -E "error while loading shared libraries|cannot open shared object file" fedora-smoke.log; then
            echo "AppImage is missing a shared library on Fedora."
            exit 1
          fi
          if grep -E "cannot register existing type|GLib-GObject-CRITICAL" fedora-smoke.log; then
            echo "AppImage hit the GLib/GIO duplicate type-registration crash on Fedora."
            exit 1
          fi
          if [ "$selftest_status" -ne 0 ]; then
            echo "AppImage self-test failed with status $selftest_status on Fedora."
            exit "$selftest_status"
          fi
          # The container has no audio device; the game is expected to fall
          # back to the BASS no-sound device and keep running until timeout
          # (124). Exit 0 (clean quit) is also fine.
          if [ "$launch_status" -ne 0 ] && [ "$launch_status" -ne 124 ]; then
            echo "AppImage exited unexpectedly with status $launch_status on Fedora."
            exit "$launch_status"
          fi
          echo "Fedora smoke test passed (self-test=$selftest_status, launch=$launch_status)."
          EOF
          docker run --rm -v "$PWD:/work" fedora:43 bash /work/fedora-smoke.sh

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.label }}
          path: |
            dist/Saltwake-*.zip
            dist/Saltwake-*.tar.gz
            dist/Saltwake-*.AppImage

  release:
    name: Release
    needs: [prepare, build]
    if: always() && needs.prepare.outputs.should_build == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'schedule' && 'dev' || github.ref }}
          fetch-depth: 0

      - uses: actions/download-artifact@v7
        with:
          path: assets
          merge-multiple: true

      - name: Prepare release notes and checksums
        env:
          IS_NIGHTLY: ${{ needs.prepare.outputs.is_nightly }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          (cd assets && sha256sum * > checksums.txt)

          if [ "$IS_NIGHTLY" = "true" ]; then
            LAST_TAG=$(git tag --list "nightly-*" --sort=-version:refname | grep -v "^$TAG$" | head -1)
            python3 tools/release_notes.py nightly \
              --previous-tag "$LAST_TAG" --output notes.md
          else
            python3 tools/release_notes.py stable \
              --version "$TAG" --output notes.md
          fi

      - name: Create release
        if: ${{ inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IS_NIGHTLY: ${{ needs.prepare.outputs.is_nightly }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          if [ "$IS_NIGHTLY" = "true" ]; then
            gh release delete "$TAG" -y --cleanup-tag 2>/dev/null || true
            gh release create "$TAG" assets/* --notes-file notes.md \
              --title "Developer snapshot $(date -u +%Y-%m-%d)" \
              --prerelease --target "${{ github.event_name == 'schedule' && 'dev' || github.ref_name }}"
          else
            if gh release view "$TAG" &>/dev/null; then
              gh release upload "$TAG" assets/* --clobber
              gh release edit "$TAG" --notes-file notes.md --title "Saltwake v${VERSION}"
            else
              gh release create "$TAG" assets/* --notes-file notes.md \
                --title "Saltwake v${VERSION}"
            fi
          fi

      - name: Send build notification
        if: ${{ inputs.dry_run != true }}
        env:
          ORINKS_BUILD_NOTIFICATION_TOKEN: ${{ secrets.ORINKS_BUILD_NOTIFICATION_TOKEN }}
          IS_NIGHTLY: ${{ needs.prepare.outputs.is_nightly }}
        run: |
          if [ -z "$ORINKS_BUILD_NOTIFICATION_TOKEN" ]; then
            echo "ORINKS_BUILD_NOTIFICATION_TOKEN is not configured; skipping notification."
            exit 0
          fi

          python - <<'PY'
          import json
          import os
          import urllib.request

          product = "Saltwake"
          release_kind = "developer snapshot" if os.environ["IS_NIGHTLY"] == "true" else "stable release"
          payload = {
              "product": product,
              "title": f"{product} {release_kind} available",
              "body": f"A new {product} {release_kind} is ready to download.",
              "url": "/saltwake/downloads",
          }
          request = urllib.request.Request(
              "https://orinks.net/api/notifications/send",
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {os.environ['ORINKS_BUILD_NOTIFICATION_TOKEN']}",
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              print(response.read().decode("utf-8"))
          PY
